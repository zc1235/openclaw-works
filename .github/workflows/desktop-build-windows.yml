name: Desktop Build Windows x64

# Cross-compiles a Windows x64 desktop app on ubuntu-latest (which gets
# assigned in seconds, unlike windows-latest that can queue for 30+ min).
#
# Produces an unpacked portable directory (run Nexu.exe directly).
# NSIS installer is NOT built — it requires a native Windows environment.
# For a full installer build, use the backed-up native workflow or wait
# for windows-latest availability.
#
# Backup of the original native-Windows workflow is at:
#   .github/workflows/desktop-build-windows-native.yml.bak

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/desktop-native-chat"

permissions:
  contents: read

concurrency:
  group: desktop-build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      # Tell the build scripts we're targeting Windows even though we're on Linux
      NEXU_TARGET_PLATFORM: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system dependencies for cross-compile
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 libwine rpm

      - name: Restore npm cache for runtime installs
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: desktop-npm-cache-${{ runner.os }}-win-x64-${{ hashFiles('packages/slimclaw/runtime-seed/package-lock.json', 'apps/controller/static/runtime-plugins/openclaw-weixin/package-lock.json') }}
          restore-keys: |
            desktop-npm-cache-${{ runner.os }}-win-x64-
            desktop-npm-cache-${{ runner.os }}-

      - name: Restore Electron build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            apps/desktop/.cache
          key: desktop-electron-cache-${{ runner.os }}-win-x64-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: |
            desktop-electron-cache-${{ runner.os }}-win-x64-
            desktop-electron-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace artifacts
        run: pnpm build

      - name: Cross-compile Windows x64 portable app
        env:
          NEXU_DESKTOP_AUTO_UPDATE_ENABLED: "false"
          # electron-builder uses these to find the win Electron zip
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
        run: |
          cd apps/desktop
          npx electron-builder --win --x64 --dir \
            --config.extraMetadata.main=dist-electron/main/bootstrap.js \
            --publish=never

      - name: Verify packaged Windows artifacts
        run: |
          set -euo pipefail
          release_dir="apps/desktop/release"
          unpacked_exe="${release_dir}/win-unpacked/Nexu.exe"

          if [ ! -f "$unpacked_exe" ]; then
            echo "ERROR: Missing unpacked Windows app executable: $unpacked_exe" >&2
            echo "Contents of release dir:"
            find "$release_dir" -type f 2>/dev/null | head -30
            exit 1
          fi

          echo "Built Windows artifacts:"
          echo " - $unpacked_exe"
          du -sh "${release_dir}/win-unpacked" || true

      - name: Upload Windows portable app (unpacked)
        uses: actions/upload-artifact@v4
        with:
          name: nexu-desktop-windows-x64-portable
          path: apps/desktop/release/win-unpacked/
          if-no-files-found: error
          retention-days: 14

      - name: Capture build logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-build-win"
          if [ -d "apps/desktop/.dist-runtime" ]; then
            cp -R apps/desktop/.dist-runtime "$RUNNER_TEMP/desktop-build-win/dist-runtime"
          fi
          if [ -d ".tmp" ]; then
            cp -R .tmp "$RUNNER_TEMP/desktop-build-win/repo-tmp"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexu-desktop-windows-x64-logs
          path: ${{ runner.temp }}/desktop-build-win
          if-no-files-found: warn
          retention-days: 3

      - name: Publish download summary
        run: |
          {
            echo "## Windows x64 Build Ready (Cross-compiled on Ubuntu)"
            echo ""
            echo "Download from the **Artifacts** section of this workflow run:"
            echo ""
            echo "- \`nexu-desktop-windows-x64-portable\` — Portable unpacked app (extract and run \`Nexu.exe\` directly)"
            echo ""
            echo "> **Note**: This is a cross-compiled build (no NSIS installer)."
            echo "> Extract the zip, then double-click \`Nexu.exe\` to run."
          } >> "$GITHUB_STEP_SUMMARY"
