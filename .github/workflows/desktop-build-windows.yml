name: Desktop Build Windows x64

# Manually triggerable build that produces the Windows x64 installer .exe and
# the unpacked app directory, uploaded as a workflow artifact so users can
# download the packaged desktop client directly from the GitHub Actions run.
#
# This workflow intentionally builds ONLY Windows x64 — no macOS, no code
# signing, no upload to R2. It is a self-contained mirror of the
# `package-windows` job from desktop-ci-dist-full.yml, adjusted so it runs on
# feature branches and on-demand.

on:
  workflow_dispatch:
  # Every push to the feature branch triggers a build. No paths filter —
  # empty / doc-only commits should still build so the user can quickly
  # retrigger a run when a queued one gets cancelled.
  push:
    branches:
      - "feat/desktop-native-chat"

# contents: write is required to create/update the GitHub Release that hosts
# the .exe as a direct-download asset (release asset URLs are stable and do
# not go through the Actions artifact interstitial page).
permissions:
  contents: write

concurrency:
  group: desktop-build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore npm cache for runtime installs
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: desktop-npm-cache-${{ runner.os }}-x64-${{ hashFiles('packages/slimclaw/runtime-seed/package-lock.json', 'apps/controller/static/runtime-plugins/openclaw-weixin/package-lock.json') }}
          restore-keys: |
            desktop-npm-cache-${{ runner.os }}-x64-
            desktop-npm-cache-${{ runner.os }}-

      - name: Restore Electron build caches
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
            apps/desktop/.cache
          key: desktop-electron-cache-${{ runner.os }}-x64-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: |
            desktop-electron-cache-${{ runner.os }}-x64-
            desktop-electron-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Windows packaging tools (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Show desktop toolchain versions
        shell: pwsh
        run: pnpm exec electron --version

      - name: Build workspace artifacts
        run: pnpm build

      - name: Stage bundled runtime tools (Node + Python)
        shell: pwsh
        # Downloads a self-contained Node.js and Python runtime into
        # apps/desktop/build/runtime-tools so the packaged app can run `node`
        # and `python` from the assistant's run_command tool. Non-fatal: if a
        # download hiccups the build still succeeds (feature degrades).
        run: |
          $ErrorActionPreference = "Stop"
          $toolsDir = Join-Path $PWD "apps/desktop/build/runtime-tools"
          New-Item -ItemType Directory -Force -Path (Join-Path $toolsDir "node") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $toolsDir "python") | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP "rt-tools"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          try {
            $nodeVersion = "v20.18.1"
            $nodeZip = Join-Path $tmp "node.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $nodeZip
            $nodeExtract = Join-Path $tmp "node"
            Expand-Archive -Path $nodeZip -DestinationPath $nodeExtract -Force
            $nodeInner = Join-Path $nodeExtract "node-$nodeVersion-win-x64"
            Copy-Item (Join-Path $nodeInner "*") (Join-Path $toolsDir "node") -Recurse -Force
            Write-Host "Staged Node.js $nodeVersion"
          } catch {
            Write-Warning "Failed to stage Node.js runtime: $($_.Exception.Message)"
          }

          try {
            $pyVersion = "3.12.7"
            $pyZip = Join-Path $tmp "python.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip" -OutFile $pyZip
            Expand-Archive -Path $pyZip -DestinationPath (Join-Path $toolsDir "python") -Force
            Write-Host "Staged Python $pyVersion"
          } catch {
            Write-Warning "Failed to stage Python runtime: $($_.Exception.Message)"
          }

          Write-Host "runtime-tools contents:"
          Get-ChildItem -Recurse (Join-Path $toolsDir "node") -ErrorAction SilentlyContinue | Select-Object -First 5 Name
          Get-ChildItem -Recurse (Join-Path $toolsDir "python") -ErrorAction SilentlyContinue | Select-Object -First 5 Name

      - name: Build unsigned Windows desktop bundle
        env:
          NEXU_DESKTOP_AUTO_UPDATE_ENABLED: "false"
        run: pnpm --filter @nexu/desktop dist:win

      - name: Verify packaged Windows artifacts
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "apps/desktop/release"
          $installerArtifacts = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File
          if ($installerArtifacts.Count -eq 0) {
            Write-Error "No Windows installer artifact was produced"
          }

          $unpackedExecutable = Join-Path $releaseDir "win-unpacked/Nexu.exe"
          if (-not (Test-Path $unpackedExecutable)) {
            Write-Error "Missing unpacked Windows app executable: $unpackedExecutable"
          }

          Write-Host "Built Windows artifacts:"
          $installerArtifacts | ForEach-Object { Write-Host " - $($_.FullName)" }
          Write-Host " - $unpackedExecutable"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          base_version=$(node -e 'process.stdout.write(require("./apps/desktop/package.json").version)')
          build_date=$(date +"%Y%m%d")
          short_sha="${GITHUB_SHA::7}"
          {
            echo "version=$base_version"
            echo "tag=win-v${base_version}-${build_date}-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Windows installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: nexu-desktop-windows-x64-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with .exe (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nexu Windows x64 ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.tag }})
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            Automated **Windows x64** desktop build (unsigned).

            - Version: `${{ steps.meta.outputs.version }}`
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`

            ## Download
            Grab the `nexu-setup-*.exe` asset below — release asset links are
            direct downloads (no Actions interstitial page), e.g.
            `https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/<file>.exe`

            This is an unsigned build for testing; Windows SmartScreen may warn
            on first launch (More info -> Run anyway).
          files: |
            apps/desktop/release/*.exe

      - name: Upload Windows portable app (unpacked)
        uses: actions/upload-artifact@v4
        with:
          name: nexu-desktop-windows-x64-unpacked
          path: apps/desktop/release/win-unpacked/**
          if-no-files-found: error
          retention-days: 14

      - name: Capture Windows build logs
        if: always()
        shell: pwsh
        run: |
          $captureDir = Join-Path $env:RUNNER_TEMP "desktop-build-win"
          New-Item -ItemType Directory -Force -Path $captureDir | Out-Null

          if (Test-Path "apps/desktop/.dist-runtime") {
            Copy-Item "apps/desktop/.dist-runtime" (Join-Path $captureDir "dist-runtime") -Recurse -Force
          }
          if (Test-Path ".tmp") {
            Copy-Item ".tmp" (Join-Path $captureDir "repo-tmp") -Recurse -Force
          }

      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexu-desktop-windows-x64-logs
          path: ${{ runner.temp }}/desktop-build-win
          if-no-files-found: warn
          retention-days: 3

      - name: Publish download summary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $installerFiles = Get-ChildItem -Path "apps/desktop/release" -Filter "*.exe" -File | Select-Object -ExpandProperty Name
          $releaseUrl = "https://github.com/$env:REPO/releases/tag/$env:RELEASE_TAG"
          "## Windows x64 Build Ready" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "### Recommended: download from the Release (direct link)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "Release page: $releaseUrl" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          foreach ($file in $installerFiles) {
            "- https://github.com/$env:REPO/releases/download/$env:RELEASE_TAG/$file" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "### Alternative: workflow Artifacts (goes through an interstitial page)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "- ``nexu-desktop-windows-x64-installer`` — NSIS installer .exe" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "- ``nexu-desktop-windows-x64-unpacked`` — Portable unpacked app (run ``Nexu.exe`` directly)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
